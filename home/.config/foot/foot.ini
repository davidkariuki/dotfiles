# Foot terminal (Omarchy / Wayland)
# Converted from the old Ghostty configuration.

[main]
# Follow the active Omarchy theme (colors, background, blur).
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color

# Ghostty used MonoLisa Nerd Font 13.5; fall back to Omarchy's Nimbus Mono PS.
font=MonoLisa Nerd Font Mono:size=13.5, Nimbus Mono PS:size=12

pad=10x10
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

# Ghostty used the Catppuccin "mantle" background at 95% opacity; keep that look.
[colors-dark]
background=181825
alpha=0.95
alpha-mode=matching
